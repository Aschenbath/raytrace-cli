# The pip wheels: built once, then installed on each platform they are for.
# Run on its own (a dispatch with a tag, or a tag push), it also uploads them
# to PyPI with trusted publishing (no token), as the pip.yml publisher with
# environment pypi. Called from npm-publish.yml it only builds and tests: that
# workflow uploads the `wheels` artifact itself, because PyPI checks a wheel's
# attestation against the top-level workflow, which a called one is not.
name: pip wheels

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, such as v0.17.4. Empty checks out the caller.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload, such as v0.17.4. Empty builds the selected branch and does not upload.
        required: false
        type: string
  push:
    tags: ['v*']
  pull_request:
    paths: ['python/**', 'package.json', '.github/workflows/pip.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.tag }}
      - uses: actions/checkout@v4
        if: ${{ inputs.tag }}
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 python/build_wheels.py
      - run: pip install twine && twine check python/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: python/dist/*.whl

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pip chooses among all six wheels, as it would from PyPI.
      - run: python -m pip install --no-index --find-links wheels raytrace-cli
      - run: raytrace --version
      - name: MCP server lists its tools
        run: |
          python - <<'PY'
          import json, subprocess
          lines = [{'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {'protocolVersion': '2025-06-18', 'capabilities': {}, 'clientInfo': {'name': 'ci', 'version': '1'}}},
                   {'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'}]
          out = subprocess.run(['raytrace', 'mcp'], input=''.join(json.dumps(l) + '\n' for l in lines),
                               capture_output=True, text=True, timeout=60, shell=False).stdout
          replies = [json.loads(l) for l in out.splitlines() if l.strip()]
          tools = next(r['result']['tools'] for r in replies if r.get('id') == 2)
          print(len(tools), 'tools'); assert len(tools) > 5
          PY
      - run: raytrace doctor || true

  # Trusted publishing, only when this file is the top-level workflow: the
  # token and each wheel's attestation then both name pip.yml, with the
  # environment below. When called, github.workflow_ref names the caller.
  publish:
    name: Publish to PyPI
    needs: install
    if: github.repository == 'Godcreatebugs/raytrace-cli' && github.event_name != 'pull_request' && contains(github.workflow_ref, '/.github/workflows/pip.yml@') && (inputs.tag || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/raytrace-cli/
    permissions:
      contents: read
      id-token: write
      attestations: write
      deployments: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - name: Require this release's six wheels
        id: wheels
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to upload non-stable version ${version}."
            exit 1
          fi
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 6 ]; then
            echo "Expected 6 wheels for ${version}, found ${#wheels[@]}."
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            case "$(basename "$wheel")" in
              raytrace_cli-"${version}"-*) ;;
              *) echo "Unexpected wheel $(basename "$wheel") for ${version}."; exit 1 ;;
            esac
          done
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/raytrace-cli/${version}/json")"
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "raytrace-cli ${version} is already on PyPI; skipped uploading." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish wheels to PyPI
        if: steps.wheels.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
          attestations: true
