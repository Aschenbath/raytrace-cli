name: Publish npm package

on:
  # Use the trusted base-branch workflow for merged PRs, including forks.
  # Only main is checked out; unmerged PR code is never executed.
  pull_request_target:
    branches: [main]
    types: [closed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag to publish to npm and the MCP Registry (for example v0.17.4). npm is skipped when that version is already published.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  queue: max

jobs:
  prepare-release:
    if: github.repository == 'Godcreatebugs/raytrace-cli' && github.event_name == 'pull_request_target' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure release commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # The release is a tag only: the version commit sits on top of main and is
      # never pushed to it, because main takes changes through pull requests
      # alone. The next version counts from the highest vX.Y.Z tag.
      - name: Make the version commit and push its release tag
        id: release
        run: node .github/scripts/prepare-npm-release.mjs

      - name: Create GitHub Release and build pip wheels
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "RayTrace CLI $RELEASE_TAG" --generate-notes
          fi
          # npm's trusted publishing refuses a run started by a pull request
          # event (404 on upload) and accepts a dispatched one, so the publish
          # is a second run of this workflow rather than the next job of this one.
          # That run also builds the wheels, uploads them to PyPI, and lists the
          # MCP server. A tag push from GITHUB_TOKEN would not start pip.yml.
          gh workflow run npm-publish.yml --ref main -f tag="$RELEASE_TAG"

  publish:
    needs: prepare-release
    if: always() && !cancelled() && github.repository == 'Godcreatebugs/raytrace-cli' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@raytrace-cli/cli
    permissions:
      contents: read
      id-token: write
      deployments: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11

      - name: Validate release and check npm registry
        id: package
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version, repository } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== '@raytrace-cli/cli' || !/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Expected the RayTrace CLI package with a stable version.');
          }
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${version}.`);
          }
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Registry check failed: HTTP ${response.status}`);
          }
          const exists = response.status === 200;
          if (!exists && repository?.url !== 'git+https://github.com/Godcreatebugs/raytrace-cli.git') {
            throw new Error('The release must include repository.url for npm provenance.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${exists}\n`);
          if (exists) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${name}@${version} is already on npm; skipped publishing.\n`);
          }
          JS

      - name: Install dependencies
        if: steps.package.outputs.exists == 'false'
        run: npm ci

      # The release tag bumps package.json and leaves server.json at main's
      # version. Align them before the tests, which read both files.
      - name: Point server.json at this release
        if: steps.package.outputs.exists == 'false'
        run: node .github/scripts/sync-mcp-server-json.mjs

      - name: Typecheck
        if: steps.package.outputs.exists == 'false'
        run: npm run typecheck

      - name: Test
        if: steps.package.outputs.exists == 'false'
        run: npm test

      # prepack builds the dashboard before publishing. Authentication uses OIDC;
      # no NPM_TOKEN or NODE_AUTH_TOKEN secret is needed.
      - name: Publish to npm
        if: steps.package.outputs.exists == 'false'
        run: npm publish --access public

  # Build and install-test the wheels on every platform (pip.yml). Called from
  # here, pip.yml does not upload them; the pypi job below does.
  wheels:
    name: Build PyPI wheels
    needs: [prepare-release, publish]
    if: always() && !cancelled() && github.repository == 'Godcreatebugs/raytrace-cli' && needs.publish.result == 'success'
    # Not used here, but GitHub refuses to start the run unless the caller
    # grants what every job in pip.yml asks for, its skipped publish included.
    permissions:
      contents: read
      id-token: write
      attestations: write
      deployments: write
    uses: ./.github/workflows/pip.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}

  # Upload the wheels from this workflow, not from pip.yml: PyPI matches the
  # trusted publisher on the workflow that runs the upload, but checks each
  # wheel's attestation against the top-level workflow. Both are this file
  # only when the upload runs here. pypi.org's publisher for this job:
  # workflow npm-publish.yml, environment pypi.
  pypi:
    name: Publish to PyPI
    needs: wheels
    if: always() && !cancelled() && github.repository == 'Godcreatebugs/raytrace-cli' && needs.wheels.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/raytrace-cli/
    permissions:
      contents: read
      id-token: write
      deployments: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - name: Require this release's six wheels
        id: wheels
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to upload non-stable version ${version}."
            exit 1
          fi
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 6 ]; then
            echo "Expected 6 wheels for ${version}, found ${#wheels[@]}."
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            case "$(basename "$wheel")" in
              raytrace_cli-"${version}"-*) ;;
              *) echo "Unexpected wheel $(basename "$wheel") for ${version}."; exit 1 ;;
            esac
          done
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/raytrace-cli/${version}/json")"
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "raytrace-cli ${version} is already on PyPI; skipped uploading." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish wheels to PyPI
        if: steps.wheels.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
          attestations: true

  # After npm and PyPI for this version are both published. The script is
  # taken from this workflow's revision, and server.json from the release tag.
  publish-registry:
    name: Publish to MCP Registry
    needs: [publish, pypi]
    if: always() && !cancelled() && github.repository == 'Godcreatebugs/raytrace-cli' && needs.publish.result == 'success' && needs.pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # Pinned on purpose. The registry's publishing guide says not to follow
      # releases/latest. v1.8.9 is signed by .github/workflows/release.yml.
      MCP_PUBLISHER_VERSION: v1.8.9
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout this workflow's publisher script
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          path: publisher

      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
          path: release

      - name: Sync server.json and require both packages to be published
        working-directory: release
        run: node "$GITHUB_WORKSPACE/publisher/.github/scripts/sync-mcp-server-json.mjs" --check-published

      - name: See if this version is already listed
        id: listed
        working-directory: release
        run: |
          version="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; process.stdout.write(JSON.parse(readFileSync("server.json","utf8")).version)')"
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Godcreatebugs%2Fraytrace/versions/${version}")"
          if [ "$code" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "io.github.Godcreatebugs/raytrace ${version} is already in the MCP Registry." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.listed.outputs.already != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.listed.outputs.already != 'true'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        if: steps.listed.outputs.already != 'true'
        working-directory: release
        run: "$GITHUB_WORKSPACE/mcp-publisher validate"

      - name: Authenticate to MCP Registry
        if: steps.listed.outputs.already != 'true'
        working-directory: release
        run: "$GITHUB_WORKSPACE/mcp-publisher login github-oidc"

      - name: Publish server to MCP Registry
        if: steps.listed.outputs.already != 'true'
        working-directory: release
        run: "$GITHUB_WORKSPACE/mcp-publisher publish"
